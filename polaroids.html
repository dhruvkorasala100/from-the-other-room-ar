<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>From the Other Room · Polaroids</title>
<script>window.MINDAR_FOVY = 63;   // phone camera field of view (long side), read by the bundled MindAR</script>
<script src="./lib/aframe-v1.5.0.min.js"></script>
<script src="./lib/mindar-image-aframe.prod.js"></script>
<script>
/* Each red page of the book is its own tracking image (polaroids/pages/left.jpg, right.jpg).
   Sizes in mm. A page is 95.25 wide x 104.8 deep. */
const PAGE_W = 95.25;
const PHOTO = { w: 54, h: 66, hover: 8 };   // Polaroid size; its bottom edge floats this far above the page
const FADE = 0.8;                           // seconds to appear
</script>
<style>
  html { background: #000; }
  /* body stays transparent: MindAR puts the camera <video> behind the scene */
  html, body { margin: 0; height: 100%; overflow: hidden; font: 15px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #fff; -webkit-user-select: none; user-select: none; }
  a-scene { position: fixed; inset: 0; }
  .a-enter-vr, .a-enter-ar, .a-orientation-modal { display: none !important; }
  #hint { position: fixed; left: 50%; bottom: max(28px, env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 5; background: rgba(14,14,16,.72); padding: 9px 16px; border-radius: 99px; font-size: 14px; white-space: nowrap; transition: opacity .5s; pointer-events: none; }
  #hint.hide { opacity: 0; }
</style>
</head>
<body>
<div id="hint">Point your phone at the open book</div>

<a-scene id="scene"
  mindar-image="imageTargetSrc: ./targets/pages-v1.mind; maxTrack: 2; filterMinCF: 0.0001; filterBeta: 10; missTolerance: 8; warmupTolerance: 3; uiScanning: no; uiLoading: yes; uiError: yes"
  color-space="sRGB" renderer="colorManagement: true; antialias: true; alpha: true"
  vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
  <a-camera position="0 0 0" look-controls="enabled: false" cursor="rayOrigin: none"></a-camera>
  <a-entity mindar-image-target="targetIndex: 0"><a-entity polaroid="src: ./polaroids/polaroid-india.jpg"></a-entity></a-entity>
  <a-entity mindar-image-target="targetIndex: 1"><a-entity polaroid="src: ./polaroids/polaroid-america.jpg"></a-entity></a-entity>
</a-scene>

<script>
const THREE = AFRAME.THREE;
const $ = id => document.getElementById(id);
const tracked = new Set();
const updateHint = () => $('hint').classList.toggle('hide', tracked.size > 0);

/* One Polaroid floating upright above the middle of its page, turned toward the phone. */
AFRAME.registerComponent('polaroid', {
  schema: { src: { type: 'string' } },
  init() {
    const tex = new THREE.TextureLoader().load(this.data.src); tex.colorSpace = THREE.SRGBColorSpace;
    this.mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, opacity: 0, side: THREE.DoubleSide });
    // page frame in mm: origin = page centre, Y up off the page, Z toward the viewer
    this.page = new THREE.Group(); this.page.scale.setScalar(1 / PAGE_W); this.page.rotation.x = Math.PI / 2;
    this.card = new THREE.Mesh(new THREE.PlaneGeometry(PHOTO.w, PHOTO.h), this.mat);
    this.card.position.set(0, PHOTO.hover + PHOTO.h / 2, 0);
    this.page.add(this.card); this.el.object3D.add(this.page);
    this.shownAt = null; this.v = new THREE.Vector3();
    const anchor = this.el.parentNode, id = this.data.src;
    anchor.addEventListener('targetFound', () => { this.shownAt = performance.now(); tracked.add(id); updateHint(); });
    anchor.addEventListener('targetLost', () => { this.shownAt = null; tracked.delete(id); updateHint(); });
  },
  tick() {
    const a = this.shownAt === null ? 0 : Math.min(1, (performance.now() - this.shownAt) / 1000 / FADE);
    this.mat.opacity = a * a * (3 - 2 * a);
    const cam = this.el.sceneEl.camera; if (!cam || this.shownAt === null) return;
    this.page.updateWorldMatrix(true, false);
    cam.getWorldPosition(this.v); this.page.worldToLocal(this.v);
    this.card.rotation.y = Math.atan2(this.v.x, this.v.z);   // face the phone, staying upright
  }
});

$('scene').addEventListener('arError', () => { $('hint').textContent = 'Camera unavailable. Allow camera access and reload.'; $('hint').classList.remove('hide'); });

/* Shown only if something goes wrong, so a screenshot says what failed. */
(() => {
  const box = document.createElement('div');
  box.style.cssText = 'position:fixed;left:12px;right:12px;top:max(12px,env(safe-area-inset-top));z-index:20;background:rgba(150,20,20,.92);color:#fff;font:12px/1.4 ui-monospace,Menlo,monospace;padding:8px 10px;border-radius:8px;display:none;white-space:pre-wrap;word-break:break-word';
  document.body.appendChild(box);
  const lines = [], show = m => { lines.push(m); box.textContent = lines.slice(-6).join('\n'); box.style.display = 'block'; };
  addEventListener('error', e => show('Error: ' + (e.message || e)));
  addEventListener('unhandledrejection', e => show('Promise: ' + (e.reason && (e.reason.name + ' ' + e.reason.message) || e.reason)));
  if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) show('This browser view has no camera access. Open the link in Safari itself.');
  setTimeout(() => { const v = document.querySelector('video'); if (!v || !v.videoWidth || v.paused) show('Camera stream not playing'); }, 10000);
})();
</script>
</body>
</html>
