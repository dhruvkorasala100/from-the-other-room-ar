<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>From the Other Room · Try it</title>
<style>
  :root { --panel: rgba(14,14,16,.82); --line: rgba(255,255,255,.16); --dim: rgba(255,255,255,.66); --red: #d6231f; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #fff; font: 15px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
  canvas, video { position: fixed; inset: 0; width: 100%; height: 100%; }
  video { opacity: 0; pointer-events: none; }
  button { font: inherit; color: #fff; background: rgba(255,255,255,.1); border: 1px solid var(--line); border-radius: 99px; padding: 10px 16px; }
  button:active { background: rgba(255,255,255,.25); }
  #start { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; background: #0c0c0d; z-index: 5; }
  #start h1 { font-size: 22px; margin: 0 0 8px; font-weight: 650; }
  #start p { color: var(--dim); margin: 0 auto 22px; max-width: 300px; }
  #start button { background: var(--red); border-color: var(--red); font-size: 17px; padding: 14px 26px; font-weight: 600; }
  #hint { position: fixed; top: max(14px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); background: var(--panel); padding: 8px 14px; border-radius: 99px; font-size: 14px; font-weight: 600; white-space: nowrap; z-index: 3; }
  #bar { position: fixed; left: 16px; right: 16px; bottom: max(16px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 10px; z-index: 3; }
  .row { display: flex; gap: 8px; justify-content: center; align-items: center; }
  #play { background: var(--red); border-color: var(--red); font-size: 17px; font-weight: 600; padding: 13px 34px; }
  .bg { background: var(--panel); }
  label { background: var(--panel); border-radius: 12px; padding: 8px 12px; display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--dim); }
  input[type=range] { flex: 1; accent-color: var(--red); }
</style>
</head>
<body>
<video id="video" playsinline muted autoplay></video>
<canvas id="gl"></canvas>

<div id="start">
  <div>
    <h1>From the Other Room</h1>
    <p>Point your phone at the pop-up house, then tap Play to watch it turn red and get painted over.</p>
    <button id="go">Start camera</button>
  </div>
</div>

<div id="hint">Point at the house, hold steady, tap Play</div>
<div id="bar">
  <label>Paper detection <input id="sens" type="range" min="0" max="1" step="0.01" value="0.5"></label>
  <div class="row">
    <button id="see" class="bg">Show detected paper</button>
    <button id="play">▶ Play</button>
  </div>
</div>

<script>
/* Timeline in seconds after Play. */
const T = { red: [0, 2.2], marks: [2.4, 8.5], streak: [3.0, 8.0], white: [9.0, 13.5], end: 15 };

const $ = id => document.getElementById(id);
const video = $('video'), canvas = $('gl');
const gl = canvas.getContext('webgl', { premultipliedAlpha: false, preserveDrawingBuffer: true });

const VS = `attribute vec2 p; void main(){ gl_Position = vec4(p, 0., 1.); }`;
const FS = `
precision highp float;
uniform sampler2D cam, fillTex;
uniform vec3 white;
uniform vec2 res, off, size;
uniform float t, sens, see;
uniform vec4 R, M, S, W;   // phase windows: start, end (xy)

float h(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float n(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.-2.*f);
  return mix(mix(h(i), h(i+vec2(1,0)), f.x), mix(h(i+vec2(0,1)), h(i+vec2(1,1)), f.x), f.y); }
float fbm(vec2 p){ float a = .5, s = 0.; for (int i = 0; i < 5; i++) { s += a*n(p); p *= 2.03; a *= .5; } return s; }
float ph(vec4 w){ return clamp((t - w.x) / (w.y - w.x), 0., 1.); }

vec3 camAt(vec2 frag){ vec2 uv = (frag - off) / size; return texture2D(cam, uv).rgb; }

// paper = bright and colourless once the room light's colour is divided out
float paper(vec3 c){
  vec3 n = clamp(c / white, 0., 1.5);
  float lum = dot(n, vec3(.299, .587, .114));
  float mx = max(n.r, max(n.g, n.b)), mn = min(n.r, min(n.g, n.b));
  float sat = (mx - mn) / (mx + 1e-3);
  float lo = mix(.50, .22, sens);
  return smoothstep(lo, lo + .12, lum) * (1. - smoothstep(.05 + sens*.05, .10 + sens*.06, sat));
}

void main(){
  vec2 fc = gl_FragCoord.xy;
  vec3 c = camAt(fc);
  // smoothed paper mask (5 taps)
  float px = 3.0;
  float m = (paper(c) * 2. + paper(camAt(fc + vec2(px, 0))) + paper(camAt(fc - vec2(px, 0)))
           + paper(camAt(fc + vec2(0, px))) + paper(camAt(fc - vec2(0, px)))) / 6.;
  m = smoothstep(.35, .75, m);

  vec2 suv = fc / res;                         // 0..1, y up (0 = bottom of screen)
  vec4 ft = texture2D(fillTex, suv);
  float keep = smoothstep(.25, .6, ft.r);        // the paper piece you're pointing at
  float enclosed = smoothstep(.3, .7, ft.a);     // shaded walls framed by paper
  m = max(m * keep, enclosed);
  vec2 p = vec2(suv.x * res.x / res.y, suv.y); // aspect-correct
  float lum = dot(c, vec3(.299, .587, .114));
  float wl = dot(white, vec3(.299, .587, .114));
  float shade = clamp(lum / (wl * .92), .35, 1.08);   // keeps the folds and shadows of the paper

  vec3 col = c;
  if (see > .5) { gl_FragColor = vec4(mix(c * .45, vec3(.24, .88, 1.), m * .75), 1.); return; }

  // 1 · red wash rising from the bottom
  float rf = mix(-.25, 1.35, ph(R));
  float red = smoothstep(rf, rf - .22, suv.y + .12 * (fbm(p * 4.) - .5));
  float brush = fbm(vec2(p.x * 3., p.y * 26.)) * .6 + fbm(p * 60.) * .4;      // dragged-brush grain
  vec3 redC = vec3(.74, .05, .05) * pow(shade, 1.2) * (.78 + .38 * brush) + vec3(.10, .0, .0) * smoothstep(.62, .8, brush);
  col = mix(col, redC, red * m);

  // 2 · black acrylic marks spreading over the ground, bottom first
  float g = ph(M);
  float strokes = fbm(vec2(p.x * 7., p.y * 2.6) + 3.1) * .75 + fbm(p * 18.) * .25;
  float thr = -.25 + 1.55 * g;
  float marks = 1. - smoothstep(thr - .025, thr, strokes + .55 * suv.y);

  // 3 · one continuous streak climbing up the middle
  float sl = ph(S) * 1.08;
  float cx = .5 + .045 * sin(suv.y * 9. + 1.) + .03 * (fbm(vec2(suv.y * 6., 2.)) - .5);
  float w = .016 + .012 * fbm(vec2(suv.y * 14., 5.));
  float tip = sl + .02 * (fbm(vec2(suv.x * 40., t)) - .5);
  float streak = (1. - smoothstep(w, w + .006, abs(suv.x - cx))) * (1. - smoothstep(tip - .01, tip, suv.y));

  float black = max(marks, streak);
  vec3 blackC = vec3(.035) * (.7 + .6 * fbm(p * 45.)) * (.8 + .3 * shade);
  col = mix(col, blackC, black * m);

  // 4 · white acrylic covers everything
  float wv = -.15 + 1.4 * ph(W);
  float cover = 1. - smoothstep(wv - .05, wv, fbm(p * 3. + 7.) * .8 + fbm(p * 14.) * .2);
  vec3 whiteC = vec3(.97, .96, .93) * (.86 + .14 * fbm(p * 38.)) * mix(1., shade, .55);
  col = mix(col, whiteC, cover * m);

  gl_FragColor = vec4(col, 1.);
}`;

function sh(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
const prog = gl.createProgram(); gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(prog); gl.useProgram(prog);
const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
const tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
[gl.TEXTURE_WRAP_S, gl.TEXTURE_WRAP_T].forEach(k => gl.texParameteri(gl.TEXTURE_2D, k, gl.CLAMP_TO_EDGE));
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
const U = {}; ['cam', 'fillTex', 'white', 'res', 'off', 'size', 't', 'sens', 'see', 'R', 'M', 'S', 'W'].forEach(k => U[k] = gl.getUniformLocation(prog, k));
gl.uniform1i(U.cam, 0); gl.uniform1i(U.fillTex, 1);

/* ---- small CPU copy of each frame: room-light colour + areas enclosed by paper ---- */
const fillT = gl.createTexture(); gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, fillT);
[gl.TEXTURE_WRAP_S, gl.TEXTURE_WRAP_T].forEach(k => gl.texParameteri(gl.TEXTURE_2D, k, gl.CLAMP_TO_EDGE));
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
gl.activeTexture(gl.TEXTURE0);
const small = document.createElement('canvas'), sctx = small.getContext('2d', { willReadFrequently: true });
const white = [0.95, 0.94, 0.9];
function analyse(sens) {
  const sw = 96, sh = Math.max(64, Math.round(96 * canvas.height / canvas.width));
  if (small.width !== sw || small.height !== sh) { small.width = sw; small.height = sh; }
  const vw = video.videoWidth, vh = video.videoHeight, s = Math.max(sw / vw, sh / vh);
  sctx.drawImage(video, (sw - vw * s) / 2, (sh - vh * s) / 2, vw * s, vh * s);
  const d = sctx.getImageData(0, 0, sw, sh).data, N = sw * sh;
  // room light = average of the brightest 5% in the central area
  const lums = [];
  for (let y = Math.floor(sh * .2); y < sh * .8; y++) for (let x = Math.floor(sw * .15); x < sw * .85; x++) { const i = (y * sw + x) * 4; lums.push([.299 * d[i] + .587 * d[i + 1] + .114 * d[i + 2], i]); }
  lums.sort((a, b) => b[0] - a[0]);
  const top = lums.slice(0, Math.max(5, Math.floor(lums.length * .05))); const acc = [0, 0, 0];
  top.forEach(([, i]) => { acc[0] += d[i]; acc[1] += d[i + 1]; acc[2] += d[i + 2]; });
  for (let k = 0; k < 3; k++) white[k] = white[k] * .8 + Math.max(.2, acc[k] / top.length / 255) * .2;
  // paper mask (same rule as the shader)
  const lo = .50 + (.22 - .50) * sens, s0 = .05 + sens * .05, s1 = .10 + sens * .06;
  const m = new Uint8Array(N);
  for (let j = 0; j < N; j++) {
    const i = j * 4, r = Math.min(1.5, d[i] / 255 / white[0]), g = Math.min(1.5, d[i + 1] / 255 / white[1]), b = Math.min(1.5, d[i + 2] / 255 / white[2]);
    const l = .299 * r + .587 * g + .114 * b, mx = Math.max(r, g, b), mn = Math.min(r, g, b), sat = (mx - mn) / (mx + 1e-3);
    m[j] = l > lo + .06 && sat < (s0 + s1) / 2 ? 1 : 0;
  }
  // close small gaps (dilate twice, erode twice), then fill anything not reachable from the border
  const morph = (src, grow) => { const o = new Uint8Array(N); for (let y = 0; y < sh; y++) for (let x = 0; x < sw; x++) {
      let v = grow ? 0 : 1; for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) { const xx = x + dx, yy = y + dy;
        const q = (xx < 0 || yy < 0 || xx >= sw || yy >= sh) ? 0 : src[yy * sw + xx]; if (grow) v |= q; else v &= q; }
      o[y * sw + x] = v; } return o; };
  let c = morph(morph(morph(morph(m, 1), 1), 0), 0);
  const seen = new Uint8Array(N), stack = [];
  for (let x = 0; x < sw; x++) { stack.push(x, (sh - 1) * sw + x); } for (let y = 0; y < sh; y++) { stack.push(y * sw, y * sw + sw - 1); }
  while (stack.length) { const j = stack.pop(); if (seen[j] || c[j]) continue; seen[j] = 1; const x = j % sw, y = (j / sw) | 0;
    if (x > 0) stack.push(j - 1); if (x < sw - 1) stack.push(j + 1); if (y > 0) stack.push(j - sw); if (y < sh - 1) stack.push(j + sw); }
  // keep only the paper you're pointing at: connected pieces that reach the centre of the screen
  const filled = new Uint8Array(N); for (let j = 0; j < N; j++) filled[j] = seen[j] ? 0 : 1;
  const keep = new Uint8Array(N), lab = new Int32Array(N); let id = 0;
  const cx0 = sw * .3, cx1 = sw * .7, cy0 = sh * .25, cy1 = sh * .7;
  for (let j0 = 0; j0 < N; j0++) {
    if (!filled[j0] || lab[j0]) continue; id++; const comp = [], st = [j0]; lab[j0] = id; let central = false;
    while (st.length) { const j = st.pop(); comp.push(j); const x = j % sw, y = (j / sw) | 0;
      if (x >= cx0 && x <= cx1 && y >= cy0 && y <= cy1) central = true;
      for (const q of [x > 0 ? j - 1 : -1, x < sw - 1 ? j + 1 : -1, y > 0 ? j - sw : -1, y < sh - 1 ? j + sw : -1])
        if (q >= 0 && filled[q] && !lab[q]) { lab[q] = id; st.push(q); } }
    if (central && comp.length > N * .01) comp.forEach(j => keep[j] = 1);
  }
  const keepD = morph(keep, 1);
  const holes = new Uint8Array(N); for (let j = 0; j < N; j++) holes[j] = keep[j] && !c[j] ? 1 : 0;
  const holesD = morph(morph(holes, 1), 1);   // overlap the speckled edge of shaded walls
  const out = new Uint8Array(N * 2);   // L = area to paint, A = enclosed (shaded walls)
  for (let y = 0; y < sh; y++) for (let x = 0; x < sw; x++) { const j = y * sw + x, o = ((sh - 1 - y) * sw + x) * 2;  // flipped: row 0 = bottom
    out[o] = keepD[j] ? 255 : 0; out[o + 1] = holesD[j] && keepD[j] ? 255 : 0; }
  gl.activeTexture(gl.TEXTURE1); gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false); gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.LUMINANCE_ALPHA, sw, sh, 0, gl.LUMINANCE_ALPHA, gl.UNSIGNED_BYTE, out);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true); gl.activeTexture(gl.TEXTURE0);
  gl.uniform3f(U.white, white[0], white[1], white[2]);
}
gl.uniform4f(U.R, T.red[0], T.red[1], 0, 0); gl.uniform4f(U.M, T.marks[0], T.marks[1], 0, 0);
gl.uniform4f(U.S, T.streak[0], T.streak[1], 0, 0); gl.uniform4f(U.W, T.white[0], T.white[1], 0, 0);

let playStart = null, see = false;
function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.width = Math.round(innerWidth * dpr); canvas.height = Math.round(innerHeight * dpr);
  gl.viewport(0, 0, canvas.width, canvas.height);
}
addEventListener('resize', resize); resize();

function frame() {
  if (video.readyState >= 2 && video.videoWidth) {
    analyse(+$('sens').value);
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, video);
    const W = canvas.width, H = canvas.height, s = Math.max(W / video.videoWidth, H / video.videoHeight);
    const sw = video.videoWidth * s, shh = video.videoHeight * s;
    gl.uniform2f(U.res, W, H); gl.uniform2f(U.size, sw, shh); gl.uniform2f(U.off, (W - sw) / 2, (H - shh) / 2);
    const t = playStart === null ? -1 : (performance.now() - playStart) / 1000;
    gl.uniform1f(U.t, t); gl.uniform1f(U.sens, +$('sens').value); gl.uniform1f(U.see, see ? 1 : 0);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    if (playStart !== null) {
      $('hint').textContent = t < T.red[1] ? 'The house turns red…' : t < T.white[0] ? 'Black marks spread and climb…' : t < T.end ? 'White covers it…' : 'Done. Tap Play to watch again';
      if (t >= T.end) { playStart = null; $('play').textContent = '▶ Play again'; }
    }
  }
  requestAnimationFrame(frame);
}

$('go').onclick = async () => {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } } });
    video.srcObject = stream; await video.play();
    $('start').remove(); requestAnimationFrame(frame);
  } catch (e) {
    $('start').querySelector('p').textContent = 'The camera did not open. Allow camera access for this site in your browser settings, then reload.';
  }
};
$('play').onclick = () => { playStart = performance.now(); see = false; $('see').textContent = 'Show detected paper'; $('play').textContent = '↺ Restart'; };
$('see').onclick = () => { see = !see; $('see').textContent = see ? 'Hide detection' : 'Show detected paper'; };
// ?autoplay=1 starts the camera and sequence without taps (used for testing)
if (new URLSearchParams(location.search).has('autoplay')) { $('go').onclick().then(() => $('play').onclick()); }
</script>
</body>
</html>
